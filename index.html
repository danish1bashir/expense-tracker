<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
</head>
<body onload="showdata(); showtotal();">



 

  <!-- Header -->
  <div id="topheader">Expense Tracker</div>
  <div style="text-align:right; padding:10px;"> 
    <button onclick="showpopup()">Add New Expense</button>
  </div>
  <h2 id="header">My Expenses List</h2>

  <!-- Add Expense Popup -->
  <div id="popup">
    <button id="cross" onclick="showpopup()">Go Back</button><br>
    <input type="text" id="ename" placeholder="expense name"><br>
    <input type="text" id="eamount" placeholder="expense amount"><br>
    <select id="cat">
      <option>--Select category</option>
      <option>Transport</option>
      <option>Food</option>
      <option>Shopping</option>   
      <option>Others</option>
    </select>
    <br><br>
    <button onclick="addexpense()">SAVE</button>
  </div>

  <!-- Edit Expense Popup -->
  <div id="popupedit">
    <button id="crossedit" onclick="showpopupedit()">Go Back</button>
    <h3>Edit Expense</h3>
    <input type="text" id="ename_edit" placeholder="username"><br>
    <input type="text" id="eamount_edit" placeholder="email"><br>
    <select id="cat_edit">
      <option>--Select category</option>
      <option>Transport</option>
      <option>Food</option>
      <option>Shopping</option>   
      <option>Others</option>
    </select>
    <br>
    <button onclick="fun_update()">Update</button>
  </div>

  <!-- Data and Total -->
  <div id="wrapper"></div>
      <div style="text-align:right; padding:10px;"> 
       <label for="filter" style="font-weight: bold; float: left; color: white;">Total By Category:</label>
        <select id="filter" onchange="showdata(); showtotal();">
         <option>All</option>
         <option>Transport</option>
         <option>Food</option>
         <option>Shopping</option>
         <option>Others</option>
        </select>
     </div>
  <div id="total"></div>


</body>
</html>
  <!-- JavaScript -->
  <script>
    let expenseList = [];
    let selectedFilterCat = 'all';
    let flag = 0;
    let selectedIndex = -1;

    function addexpense() {
      const d = new Date().toLocaleString();
      const n = document.getElementById("ename").value;
      const a = document.getElementById("eamount").value;
      let c = document.getElementById("cat").value.trim();
      c = c.charAt(0).toUpperCase() + c.slice(1).toLowerCase();  // Fix casing

      const i = expenseList.length + 1;
      const obj = { id: i, name: n, amount: a, category: c, doe: d };

      expenseList.push(obj);
      localStorage.setItem("list", JSON.stringify(expenseList));

      showpopup();
      document.getElementById("ename").value = "";
      document.getElementById("eamount").value = "";
      document.getElementById("cat").value = "";
      showdata();
      showtotal();
    }

    function showdata() {
      let data = [];
      let t = JSON.parse(localStorage.getItem("list")) || [];
      expenseList = t;

      if (document.getElementById("filter")) {
        selectedFilterCat = document.getElementById("filter").value;
        data = selectedFilterCat === 'All' ? expenseList : expenseList.filter(e => e.category.toLowerCase() === selectedFilterCat.toLowerCase());
      } else {
        data = expenseList;
      }

      let temp = `<table>
                    <tr>
                      <th>id</th>
                      <th>name</th>
                      <th>amount</th>
                      <th>category</th>
                      <th>date/time</th>
                      <th>delete</th>
                      <th>edit</th>
                    </tr>`;

      data.forEach((e, i) => {
        temp += `<tr>
                   <td>${e.id}</td>
                   <td>${e.name}</td>
                   <td>${e.amount}</td>
                   <td>${e.category}</td>
                   <td>${e.doe}</td>
                   <td><button onclick="deleteit(${i})">delete</button></td>
                   <td><button onclick="editit(${i})">edit</button></td>
                 </tr>`;
      });

      temp += `</table>`;
      document.getElementById("wrapper").innerHTML = temp;
    }

    function showtotal() {
      let t = JSON.parse(localStorage.getItem("list")) || [];
      expenseList = t;

      let selectedCat = document.getElementById("filter").value;
      let filtered = selectedCat === 'All' ? expenseList : expenseList.filter(e => e.category.toLowerCase() === selectedCat.toLowerCase());

      const total = filtered.reduce((sum, e) => sum + parseInt(e.amount || 0), 0);
      document.getElementById("total").innerHTML = "Total: " + total;
    }

    function deleteit(index) {
      expenseList.splice(index, 1);
      localStorage.setItem("list", JSON.stringify(expenseList));
      showdata();
      showtotal();
    }

    function showpopup() {
      const popup = document.getElementById("popup");
      popup.style.visibility = (flag === 0) ? 'visible' : 'hidden';
      flag = (flag === 0) ? 1 : 0;
    }

    function showpopupedit() {
      document.getElementById("popupedit").style.visibility = 'hidden';
    }

    function editit(index) {
      selectedIndex = index;
      const item = expenseList[index];
      document.getElementById("ename_edit").value = item.name;
      document.getElementById("eamount_edit").value = item.amount;
      document.getElementById("cat_edit").value = item.category;
      document.getElementById("popupedit").style.visibility = 'visible';
    }

    function fun_update() {
      const u = document.getElementById("ename_edit").value;
      const e = document.getElementById("eamount_edit").value;
      let c = document.getElementById("cat_edit").value.trim();
      c = c.charAt(0).toUpperCase() + c.slice(1).toLowerCase(); // Fix casing

      const obj = {
        id: expenseList[selectedIndex].id,
        name: u,
        amount: e,
        category: c,
        doe: expenseList[selectedIndex].doe
      };

      expenseList.splice(selectedIndex, 1, obj);
      localStorage.setItem("list", JSON.stringify(expenseList));
      showdata();
      showtotal();
      document.getElementById("popupedit").style.visibility = 'hidden';
    }
  </script>

  <!-- CSS Style -->
   <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    #topheader {
      background-color: #2ab7a9;
      color: white;
      padding: 20px;
      font-size: 28px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h2#header {
      text-align: center;
      margin-top: 20px;
      color: #2ab7a9;
    }

    button {
      background-color: #2ab7a9;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #219083;
    }

    #popup, #popupedit {
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      padding: 20px;
      width: 300px;
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 12px;
      visibility: hidden;
      z-index: 1000;
    }

    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    #wrapper {
      margin: 30px auto;
      width: 90%;
      max-width: 1000px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: center;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #2ab7a9;
      color: white;
      font-weight: 500;
    }

    tr:hover {
      background-color: #e0f7f5;
    }

    #total {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 10px 20px;
      color: #2ab7a9;
    }

    #filter {
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 150px;
    }

    @media (max-width: 600px) {
      #wrapper, #popup, #popupedit {
        width: 95%;
      }

      table, thead, tbody, th, td, tr {
        display: block;
      }

      td {
        text-align: left;
        padding-left: 50%;
        position: relative;
      }

      td::before {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 45%;
        white-space: nowrap;
      }

      td:nth-of-type(1)::before { content: "ID"; }
      td:nth-of-type(2)::before { content: "Name"; }
      td:nth-of-type(3)::before { content: "Amount"; }
      td:nth-of-type(4)::before { content: "Category"; }
      td:nth-of-type(5)::before { content: "Date/Time"; }
      td:nth-of-type(6)::before { content: "Delete"; }
      td:nth-of-type(7)::before { content: "Edit"; }
    }
  </style>
